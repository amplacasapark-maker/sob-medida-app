<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sob Medida · Ampla</title>
<meta name="theme-color" content="#27394D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: coluna de celular centralizada; cabeçalho colorido por tipo de tela, cartões brancos sobre fundo de obra (areia), barra inferior fixa. Visual único (claro) por escolha — é a cara do app. */
:root{
  --navy:#27394D; --navy-2:#1B2A3A; --ground:#D5DADF; --paper:#FFFFFF; --ink:#16202B; --muted:#4B5563; --line:#CBD5E1; --line-2:#E5E1DA;
  --amber:#92400E; --amber-bg:#FEF3C7; --green:#14532D; --green-bg:#DCFCE7; --violet:#5B21B6; --violet-bg:#EDE9FE;
  --blue:#1E3A8A; --blue-bg:#DBEAFE; --indigo:#3730A3; --indigo-bg:#E0E7FF; --red:#B91C1C; --red-bg:#FEE2E2; --stone:#D6D3CD;
  --display:'Barlow','Arial Narrow',sans-serif; --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html,body{margin:0}
body{background-color:var(--ground);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(120,130,140,.06) 1px 2px,transparent 2px 4px),linear-gradient(180deg,#E9ECEF 0%,#CDD3D8 45%,#E2E5E8 70%,#C8CED4 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:transparent;position:relative}
.demo{background:#FFF7E6;color:var(--amber);font-size:12px;font-weight:600;padding:6px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #F5D9A8}
.demo button{border:0;background:transparent;color:var(--amber);text-decoration:underline;font-size:12px;font-weight:600;padding:4px 0}
.hd{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.18) 100%)!important;border-bottom:2px solid #9AA4AE;color:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd .back{align-self:flex-start;border:0;background:transparent;color:#fff;font-size:14px;padding:4px 0;opacity:.95}
.hd h1{margin:0;font-family:var(--display);font-weight:700;font-size:21px;text-wrap:balance}
.hd .sub{font-size:14px;opacity:.92}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em}
.chipw{font-size:13px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;border:0;color:#fff}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.body{display:flex;flex-direction:column;gap:12px;padding:14px 16px 24px;flex-grow:1}
.card{background:linear-gradient(180deg,#FFFFFF,#F6F7F8);border:1px solid #C4CBD2;box-shadow:0 1px 2px rgba(22,32,43,.08);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.h{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.lb{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.in{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;width:100%;min-width:0}
textarea.in{height:64px;padding:8px 10px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:linear-gradient(180deg,#FFFFFF,#F1F3F5);border:1px solid #C4CBD2;border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.vis{text-align:left;border:1px solid #C4CBD2;box-shadow:0 1px 2px rgba(22,32,43,.08);background:linear-gradient(180deg,#FFFFFF,#F6F7F8);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px;width:100%}
.vis .t{font-family:var(--display);font-weight:600;font-size:16px}
.vis .a{font-size:14px;color:#374151}.vis .d{font-size:13px;color:var(--muted)}
.vis.done{opacity:.72}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-med{background:var(--blue-bg);color:var(--blue)}.p-ret{background:var(--amber-bg);color:var(--amber)}.p-ins{background:var(--violet-bg);color:var(--violet)}.p-ok{background:var(--green-bg);color:var(--green)}.p-late{background:var(--red-bg);color:#991B1B}.p-prod{background:var(--indigo-bg);color:var(--indigo)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#374151;font-size:14px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.sq{border-radius:10px;padding:0 6px}
.chip.amber.on{background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber)}
.seg{display:flex;gap:4px;background:#E8E5DF;border-radius:10px;padding:4px}
.seg button{flex:1;height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ft{background-image:linear-gradient(180deg,#F7F8F9,#E3E7EA)!important;position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line-2);z-index:4}
.btn{flex:1;min-height:52px;border:0;border-radius:12px;font-weight:700;font-size:15px;padding:0 12px}
.b-navy{background:var(--navy);color:#fff}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-amber-solid{background:var(--amber);color:#fff}.b-green{background:var(--green);color:#fff}.b-violet{background:var(--violet);color:#fff}
.btn:disabled{background:#CBD5E1;color:#64748B;cursor:not-allowed}
.btn.sm{flex:0 0 auto;width:124px}
.app{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;box-shadow:0 -2px 10px rgba(22,32,43,.08);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background-color:#E4E7EA;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px),linear-gradient(180deg,#F2F4F5,#D3D8DD);border-top:1px solid #AEB6BE;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{border:0;background:transparent;color:#3E4953;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;position:relative;padding:0 2px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--navy);background:rgba(255,255,255,.7)}
.nav button.on::before{content:'';position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--navy)}
.nav .nb{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:999px;background:var(--amber);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.th{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--stone);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;position:relative}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.th.vid{background:var(--navy)}
.add{aspect-ratio:1;border:2px dashed #94A3B8;border-radius:8px;background:#fff;color:#475569;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add input{display:none}
.step{display:flex;gap:12px;padding:7px 0;align-items:flex-start}
.dot{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;font-weight:700}
.dot.ok{background:var(--green)}.dot.cur{background:var(--navy)}.dot.off{border:2px solid #94A3B8}
.step.off{opacity:.5}
.bar{height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden}.bar i{display:block;height:6px;background:var(--navy);border-radius:3px}
.late{border:2px solid var(--red)}
.note{font-size:13px;font-weight:600;border-radius:8px;padding:8px 10px}
.stbtn{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:10px;padding:0 12px;font-weight:600;text-align:left;background:#fff;border:1px solid var(--line);color:#374151;width:100%}
.stbtn .o{width:20px;height:20px;border-radius:999px;border:2px solid #94A3B8;flex-shrink:0}
.stbtn.on .o{border:0;background:currentColor}
.sig{width:100%;height:140px;border:1px dashed #94A3B8;border-radius:8px;background:#FAFAF9;touch-action:none;display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:#F0FDF4;border:1px solid #86EFAC;border-radius:10px;padding:10px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--green)}
.hist{display:flex;gap:10px;font-size:14px}.hist span:first-child{color:var(--muted);width:48px;flex-shrink:0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 8px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px}
.logo{height:26px;width:auto;display:block}
.hd .logo{height:24px;align-self:flex-start;width:auto}
.stepper{border:1px solid #C4CBD2;display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:0;background:var(--paper);border-radius:14px;padding:8px 4px}
.sp{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:0;text-align:center;font-weight:600;color:var(--muted);padding:4px 2px;border-radius:10px;min-height:56px}
.sp .dot{width:24px;height:24px;font-size:12px}
.sp.cur{color:var(--navy)}.sp.ok{color:var(--green)}.sp.off{opacity:.55;cursor:default}
.sp.at{background:#EEF2F7}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.yn button{min-height:56px;border-radius:12px;font-weight:700;font-size:16px;border:2px solid var(--line);background:#fff;color:#374151}
.yn .sim.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.yn .nao.on{background:var(--red-bg);border-color:var(--red);color:#991B1B}
.card.extra{border:2px solid #F5D9A8}
.chip.refa{color:#991B1B;border-color:#E5A3A3}
.chip.refa.on{background:#B91C1C;border-color:#B91C1C;color:#fff}
.srchbtn{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:10px;border:1px solid #AEB6BE;background:linear-gradient(180deg,#FFFFFF,#EEF1F3);color:#4B5563;font-size:15px;padding:0 14px;text-align:left}
.srchbtn svg,.srch svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 12px;color:#4B5563;border:2px solid #9AA4AE}
.srch input{flex:1;min-width:0;height:48px;border:0;outline:0;font-size:16px;background:transparent;color:var(--ink)}
.th{position:relative;text-decoration:none}.th .pq{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.55);border-radius:6px;font-size:12px;padding:1px 3px}
.sync{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;padding:6px 16px;border-bottom:1px solid transparent}
.sync.ok{background:#E7F6EC;color:#14532D;border-color:#B7E1C3}.sync.pend{background:#FFF4DC;color:#92400E;border-color:#F5D9A8}.sync.off{background:#FDE8E8;color:#991B1B;border-color:#F3B4B4}
.resp{display:flex;gap:10px;align-items:center;background:#EEF2F7;border-radius:10px;padding:10px;font-size:14px}
.mmrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:end}
.mmrow .x{padding-bottom:12px;font-weight:700;font-size:16px;color:var(--muted)}
.mmw{position:relative;display:block}
.mmw i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.mmw .in{padding-right:32px;font-variant-numeric:tabular-nums;font-weight:600}
.miss{font-size:12px;color:var(--red);font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>

      '</div><div class="card"><h2 class="h">Responsável pelo processo</h2><div class="resp"><span class="dot cur" style="width:30px;height:30px">R</span><div><b>Roberta</b><div style="font-size:12px;color:var(--muted)">Acompanha o processo do agendamento à instalação. Somente ela dá a baixa final.</div></div></div>'+

  /* ---------- 6 · Painel de obras ---------- */
  function atrasada(o){return o.etapa===3&&o.prod&&diff(o.prod.prazo)<0}
  function vPainel(){
    var all=S.obras.slice();var late=all.filter(atrasada);
    var list=R.painel==='atrasadas'?late:all;
    var cnt=function(e){return all.filter(function(o){return o.etapa===e}).length};
    var h='<header class="hd" style="background:var(--navy)"><div class="row between">'+logo()+'<button class="chipw" data-nav="agendar">+ Nova obra</button></div><h1 style="font-size:20px">Painel de obras</h1><button class="chipw" data-nav="bonus" style="align-self:stretch;min-height:44px;border-radius:10px;font-weight:700;font-size:14px">Relatório de bônus da produção ›</button>'+
      '<div class="row" style="font-size:13px"><button class="chipw" data-painel="todas" style="'+(R.painel==='todas'?'background:#fff;color:var(--navy);font-weight:700':'')+'">Todas '+all.length+'</button><button class="chipw" data-painel="atrasadas" style="'+(R.painel==='atrasadas'?'background:#fff;color:var(--navy);font-weight:700':'')+'">Atrasadas '+late.length+'</button></div></header>';
    h+='<div class="body"><div class="g3"><div class="stat"><b>'+(cnt(0)+cnt(1))+'</b><span>Medição/aprov.</span></div><div class="stat"><b>'+cnt(2)+'</b><span>Orçamento</span></div><div class="stat"><b>'+cnt(3)+'</b><span>Produção</span></div></div>';
    var groups=[[3,'Em produção'],[4,'Instalação'],[2,'Orçamento'],[1,'Aprovado'],[0,'Visita / medição'],[5,'Concluídas']];
    groups.forEach(function(g){var it=list.filter(function(o){return o.etapa===g[0]});if(!it.length)return;
      h+='<h2 class="h" style="margin-top:4px">'+g[1]+'</h2>';
      it.forEach(function(o){h+=obraCard(o)})});
    if(!list.length)h+='<div class="empty">Nenhuma obra atrasada.</div>';
    return h+'</div>'+nav();
  }
  function obraCard(o){
    var pill='',sub=o.peca+' · Pedido '+o.pedido,bar='';
    if(o.etapa===3&&o.prod){var d=diff(o.prod.prazo);pill=d<0?'<span class="pill p-late">ATRASADA '+(-d)+' dia'+(d===-1?'':'s')+'</span>':'<span class="pill p-prod">PRONTO EM '+d+' DIA'+(d===1?'':'S')+'</span>';sub+=' · prazo '+br(o.prod.prazo);
      var tot=Math.max(1,-diff(o.prod.entrada)+d),pct=Math.min(100,Math.round(-diff(o.prod.entrada)/tot*100));bar='<div class="bar"><i style="width:'+pct+'%;'+(d<0?'background:var(--red)':'')+'"></i></div>'}
    else if(o.etapa===5)pill='<span class="pill p-ok">CONCLUÍDA</span>';
    else if(o.etapa===4)pill='<span class="pill p-ins">INSTALAÇÃO</span>';
    else if(o.etapa===2){pill='<span class="pill p-ret">ORÇAMENTO</span>';if(o.orc&&o.orc.valor)sub+=' · '+brl(o.orc.valor)}
    else if(o.etapa===1)pill='<span class="pill p-ok">APROVADO</span>';
    else pill='<span class="pill p-med">MEDIÇÃO</span>';
    return '<button class="vis'+(atrasada(o)?' late':'')+'" data-obra="'+o.id+'"><div class="row between" style="width:100%"><span class="t">'+esc(o.cliente)+'</span>'+pill+'</div><div class="d">'+esc(sub)+'</div>'+(bar?'<div style="width:100%">'+bar+'</div>':'')+'</button>';
  }

  /* ---------- 7 · Etapas da obra ---------- */
  function vEtapas(){
    var o=obra(R.id);var back=R.from==='busca'?'busca|Pesquisa':R.tab==='producao'?'producao|Produção':'painel|Painel de obras';
    var h=head('var(--navy)',back,o.cliente,o.peca+' · Pedido '+o.pedido);
    var f=R.form;if(!f.oinit){f.oinit=1;var oc=o.orc||{};f.oval=oc.valor||'';f.oext=oc.extra||'';f.oobs=oc.obs||'';f.omot=oc.mot||''}
    h+='<div class="body">'+stepper(o,-1)+'<div class="card" style="gap:4px"><div style="font-size:12px;color:var(--muted)">Responsável pelo agendamento e pela baixa final</div><b>'+esc(o.resp||'A definir')+'</b></div>';
    h+='<div class="card" style="gap:6px"><div class="row between"><h2 class="h">Dados do agendamento</h2>'+(pode('agendamento')?'<button class="chip" style="min-height:40px" data-act="editAg">Alterar</button>':'')+'</div><div style="font-size:14px">'+esc(o.endereco)+'</div><div style="font-size:13px;color:var(--muted)">Contato '+esc(o.contato)+' · Vendedor '+esc(o.vendedor)+' · Pedido '+esc(o.pedido)+'</div>'+(pode('agendamento')?'':lockNote('agendamento'))+'</div>';
    if(o.etapa>=1)h+=orcCard(o,f,o.etapa<=2);
    if(o.etapa>=3&&o.etapa<5)h+=finCard(o);
    if(o.itens&&o.itens.length){h+='<div class="card" style="gap:6px"><h2 class="h">Itens medidos</h2>'+o.itens.map(function(it,i){return '<div class="row between" style="font-size:14px;gap:10px"><span style="min-width:0">'+(i+1)+'. '+esc(nomeItem(it))+'</span><span class="pill '+(it.extra?'p-ret">A MAIS':'p-med">PROGRAMADO')+'</span></div>'}).join('')+'</div>'}

    ETAPAS.forEach(function(e,i){var st=i<o.etapa||o.etapa===5?'ok':i===o.etapa?'cur':'off';
      var info='';o.hist.forEach(function(x){if(x[1].toLowerCase().indexOf(e.split(' ')[0].toLowerCase())>=0||(i===3&&/produção/.test(x[1])))info=br(x[0])+' · '+x[1]});
      h+='<div class="step'+(st==='off'?' off':'')+'"><span class="dot '+st+'">'+(st==='ok'?'✓':st==='cur'?(i+1):'')+'</span><div><b'+(st==='cur'?' style="color:var(--navy)"':'')+'>'+e+'</b>'+(info&&st!=='off'?'<div style="font-size:13px;color:var(--muted)">'+esc(info)+'</div>':'')+'</div></div>'});
    h+='</div>';
    if(o.prod){var d=diff(o.prod.prazo);h+='<div class="card"><h2 class="h">Produção</h2><div class="g2"><div class="lb">Entrada<div class="in" style="display:flex;align-items:center">'+brY(o.prod.entrada)+'</div></div><div class="lb">Prazo de entrega<div class="in" style="display:flex;align-items:center;font-weight:700">'+brY(o.prod.prazo)+'</div></div></div>'+
      '<div class="note" style="'+(d<0?'background:var(--red-bg);color:#991B1B':'background:var(--indigo-bg);color:var(--indigo)')+'">'+(d<0?'Atrasada '+(-d)+' dia(s)':d===0?'Prazo é hoje':'Faltam '+d+' dia(s) para o prazo')+'</div><button class="btn b-navy" style="flex:none" data-fprod="'+o.id+'">Abrir ficha de produção</button></div>'}
    var vs=S.visitas.filter(function(v){return v.obra===o.id}).sort(function(a,b){return (a.data+a.hora).localeCompare(b.data+b.hora)});
    if(vs.length)h+='<div class="card" style="gap:6px"><h2 class="h">Visitas do cliente ('+vs.length+')</h2>'+vs.map(function(v){var tp=v.done?['FEITA','p-ok']:TIPO[v.tipo];return '<button class="row between" data-vis="'+v.id+'" style="border:0;background:transparent;padding:6px 0;border-bottom:1px solid var(--line-2);text-align:left;width:100%;font-size:14px"><span><b>'+br(v.data)+' '+v.hora+'</b> · '+TIPO[v.tipo][0].toLowerCase()+'</span><span class="pill '+tp[1]+'">'+tp[0]+'</span></button>'}).join('')+'</div>';
    h+='<div class="card"><h2 class="h">Histórico</h2>'+o.hist.map(function(x){return '<div class="hist"><span>'+br(x[0])+'</span><span>'+esc(x[1])+'</span></div>'}).join('')+'</div></div>';
    var nx='';
    if(o.etapa===0){var mv=visDe(o,'med');nx=mv&&!mv.done?'<button class="btn b-navy" data-passo="1" data-oid="'+o.id+'">Passo 2 · Medição ('+br(mv.data)+' '+mv.hora+')</button>':'<button class="btn b-green" data-act="avancar">Medição feita → Aprovado</button>'}
    else if(o.etapa===1)nx='<button class="btn b-green" data-act="avancar">Orçamento enviado</button>';
    else if(o.etapa===2)nx='<button class="btn b-green" data-act="avancar">Orçamento aceito → Passo 3 · Produção</button>';
    else if(o.etapa===3)nx='<button class="btn b-navy" data-fprod="'+o.id+'">Passo 3 · Ficha de produção</button>';
    else if(o.etapa===4&&o.aguardaBaixa){nx=euRoberta()?'<button class="btn b-green" data-act="baixaHub">Dar baixa final (Roberta)</button>':'<button class="btn" disabled>Aguardando baixa da Roberta</button>'}

    if(nx)h+='<div class="ft">'+nx+'</div>';

  }

  /* ---------- 8 · Produção ---------- */
  function vProdLista(){
    var it=S.obras.filter(function(o){return o.prod&&o.etapa>=3});
    var h='<header class="hd" style="background:var(--navy)">'+logo()+'<h1>Produção</h1><div class="sub">Pedidos em produção e aguardando instalação</div></header><div class="body">';

      h+='<button class="vis'+(atrasada(o)?' late':'')+'" data-fprod="'+o.id+'"><div class="row between" style="width:100%"><span class="t">'+esc(o.cliente)+'</span><span class="pill" style="background:'+s[3]+';color:'+s[2]+'">'+s[1].toUpperCase()+'</span></div><div class="d">'+esc(nomeProd(p))+' · '+esc(p.medida||'sem medida')+'</div><div class="d">Pedido '+esc(o.pedido)+' · '+(p.local==='ter'?'Terceiros':'Sob medida')+' · prazo '+br(p.prazo)+(d<0&&p.status!=='entregue'?' · <b style="color:var(--red)">atrasado</b>':'')+'</div></button>'});
    return h+'</div>'+nav();
  }

    var d=diff(f.prazo);

    h+='<div class="card"><h2 class="h">Pedido</h2><label class="lb">Nome do cliente<input class="in" id="p_cli" value="'+esc(f.cli)+'"></label><div class="g2"><label class="lb">Nº do pedido<input class="in" id="p_ped" value="'+esc(f.ped)+'"></label><label class="lb">Vendedor<select class="in" id="p_vend">'+VENDEDORES.map(function(x){return '<option'+(x===f.vend?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label></div><label class="lb">Endereço<input class="in" id="p_end" value="'+esc(f.end)+'"></label></div>';
    h+='<div class="card"><h2 class="h">Local da produção</h2><div class="seg"><button data-local="sob" class="'+(f.local==='sob'?'on':'')+'">Sob medida</button><button data-local="ter" class="'+(f.local==='ter'?'on':'')+'">Terceiros</button></div>'+(f.local==='ter'?'<label class="lb">Empresa terceirizada<input class="in" id="p_forn" placeholder="Nome do fornecedor" value="'+esc(f.forn)+'"></label>':'')+'</div>';

    if(f.produto==='refacao')h+='<div style="border:1px dashed #E5A3A3;background:#FFF5F5;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;color:#991B1B">Peça de refação · custo negativo interno (não é cobrado do cliente)</div>'+

  function vAtivar(){return '<header class="hd" style="background:var(--navy)">'+logo()+'<h1>Sob Medida · Ampla</h1><div class="sub">Aparelho não ativado</div></header><div class="body"><div class="card"><h2 class="h">Este aparelho ainda não foi liberado</h2><p style="margin:0">Peça ao Wiliam o <b>link de ativação</b> com o seu nome. Abra o link uma vez neste celular e o app fica liberado com o seu usuário.</p><p style="margin:0;font-size:13px;color:var(--muted)">Versão '+VERSAO+'</p></div></div>'}
