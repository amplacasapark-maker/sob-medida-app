<style>
/* Layout: coluna de celular centralizada; cabeçalho colorido por tipo de tela, cartões brancos sobre fundo de obra (areia), barra inferior fixa. Visual único (claro) por escolha — é a cara do app. */
:root{
  --navy:#27394D; --navy-2:#1B2A3A; --ground:#D5DADF; --paper:#FFFFFF; --ink:#16202B; --muted:#4B5563; --line:#CBD5E1; --line-2:#E5E1DA;
  --amber:#92400E; --amber-bg:#FEF3C7; --green:#14532D; --green-bg:#DCFCE7; --violet:#5B21B6; --violet-bg:#EDE9FE;
  --blue:#1E3A8A; --blue-bg:#DBEAFE; --indigo:#3730A3; --indigo-bg:#E0E7FF; --red:#B91C1C; --red-bg:#FEE2E2; --stone:#D6D3CD;
  --display:'Barlow','Arial Narrow',sans-serif; --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html,body{margin:0}
body{background-color:var(--ground);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(120,130,140,.06) 1px 2px,transparent 2px 4px),linear-gradient(180deg,#E9ECEF 0%,#CDD3D8 45%,#E2E5E8 70%,#C8CED4 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:transparent;position:relative}
.demo{background:#FFF7E6;color:var(--amber);font-size:12px;font-weight:600;padding:6px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #F5D9A8}
.demo button{border:0;background:transparent;color:var(--amber);text-decoration:underline;font-size:12px;font-weight:600;padding:4px 0}
.hd{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.18) 100%)!important;border-bottom:2px solid #9AA4AE;color:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd .back{align-self:flex-start;border:0;background:transparent;color:#fff;font-size:14px;padding:4px 0;opacity:.95}
.hd h1{margin:0;font-family:var(--display);font-weight:700;font-size:21px;text-wrap:balance}
.hd .sub{font-size:14px;opacity:.92}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em}
.chipw{font-size:13px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;border:0;color:#fff}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.body{display:flex;flex-direction:column;gap:12px;padding:14px 16px 24px;flex-grow:1}
.card{background:linear-gradient(180deg,#FFFFFF,#F6F7F8);border:1px solid #C4CBD2;box-shadow:0 1px 2px rgba(22,32,43,.08);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.h{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.lb{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.in{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;width:100%;min-width:0}
textarea.in{height:64px;padding:8px 10px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:linear-gradient(180deg,#FFFFFF,#F1F3F5);border:1px solid #C4CBD2;border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.vis{text-align:left;border:1px solid #C4CBD2;box-shadow:0 1px 2px rgba(22,32,43,.08);background:linear-gradient(180deg,#FFFFFF,#F6F7F8);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px;width:100%}
.vis .t{font-family:var(--display);font-weight:600;font-size:16px}
.vis .a{font-size:14px;color:#374151}.vis .d{font-size:13px;color:var(--muted)}
.vis.done{opacity:.72}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-ast{background:#E0F2F1;color:#0F5E59}
.p-med{background:var(--blue-bg);color:var(--blue)}.p-ret{background:var(--amber-bg);color:var(--amber)}.p-ins{background:var(--violet-bg);color:var(--violet)}
.p-ent{background:#E0F2FE;color:#075985}
.nav.n8 button{font-size:8.9px}.p-ok{background:var(--green-bg);color:var(--green)}.p-late{background:var(--red-bg);color:#991B1B}.p-prod{background:var(--indigo-bg);color:var(--indigo)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#374151;font-size:14px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.sq{border-radius:10px;padding:0 6px}
.chip.amber.on{background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber)}
.seg{display:flex;gap:4px;background:#E8E5DF;border-radius:10px;padding:4px}
.seg button{flex:1;height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ft{background-image:linear-gradient(180deg,#F7F8F9,#E3E7EA)!important;position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line-2);z-index:4}
.btn{flex:1;min-height:52px;border:0;border-radius:12px;font-weight:700;font-size:15px;padding:0 12px}
.b-navy{background:var(--navy);color:#fff}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-amber-solid{background:var(--amber);color:#fff}.b-green{background:var(--green);color:#fff}.b-violet{background:var(--violet);color:#fff}
.btn:disabled{background:#CBD5E1;color:#64748B;cursor:not-allowed}
.btn.sm{flex:0 0 auto;width:124px}
.app{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border-top:1px solid #E3E7EB;box-shadow:0 -4px 16px rgba(22,32,43,.06);padding:5px 3px calc(5px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.8px;letter-spacing:-.01em;position:relative;padding:0 1px;margin:0 1px;border-radius:14px;font-weight:500;color:#7A8591;transition:background .15s,color .15s}
.nav button.on{color:var(--navy);background:#E6EDF5;font-weight:700}
.nav button:active{background:#F0F3F7}
.nav .nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:999px;background:#DC2626;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thd{aspect-ratio:1;width:100%;border-radius:8px;background:#E8EEF5;border:1px solid #C9D3DE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--navy);font-size:12px;font-weight:700;text-decoration:none;position:relative}
.thd .pq{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.55);border-radius:6px;font-size:12px;padding:1px 3px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.th{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--stone);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;position:relative}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.th.vid{background:var(--navy)}
.add{aspect-ratio:1;border:2px dashed #94A3B8;border-radius:8px;background:#fff;color:#475569;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add input{display:none}
.step{display:flex;gap:12px;padding:7px 0;align-items:flex-start}
.dot{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;font-weight:700}
.dot.ok{background:var(--green)}.dot.cur{background:var(--navy)}.dot.off{border:2px solid #94A3B8}
.step.off{opacity:.5}
.bar{height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden}.bar i{display:block;height:6px;background:var(--navy);border-radius:3px}
.late{border:2px solid var(--red)}
.note{font-size:13px;font-weight:600;border-radius:8px;padding:8px 10px}
.stbtn{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:10px;padding:0 12px;font-weight:600;text-align:left;background:#fff;border:1px solid var(--line);color:#374151;width:100%}
.stbtn .o{width:20px;height:20px;border-radius:999px;border:2px solid #94A3B8;flex-shrink:0}
.stbtn.on .o{border:0;background:currentColor}
.sig{width:100%;height:140px;border:1px dashed #94A3B8;border-radius:8px;background:#FAFAF9;touch-action:none;display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:#F0FDF4;border:1px solid #86EFAC;border-radius:10px;padding:10px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--green)}
.hist{display:flex;gap:10px;font-size:14px}.hist span:first-child{color:var(--muted);width:48px;flex-shrink:0;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{border:0;border-radius:14px;padding:11px 11px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;background:#fff;border-top:6px solid var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12);min-width:0;font:inherit;color:var(--ink)}
.pcard .t{font-weight:700;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}.pcard .d{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.pcard .st{font-size:12.5px;font-weight:700;color:var(--navy)}
.pcard.late{border-top-color:var(--red);background:#FFF5F5}.pcard.warn{border-top-color:#D97706;background:#FFFBEB}.pcard.ok{border-top-color:var(--green)}.pcard.fin{border-top-color:#2563EB;background:#F3F7FF}.pcard.ag{border-top-color:var(--violet);background:#F7F4FE}
.pdots{display:flex;gap:3px}.pdots i{flex:1;height:6px;border-radius:3px;background:#E5E7EB}.pdots i.on{background:var(--navy)}.pcard.late .pdots i.on{background:var(--red)}.pcard.fin .pdots i.on{background:#2563EB}
.pflag{font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 7px;align-self:flex-start}
.pleg{display:flex;flex-wrap:wrap;gap:6px}.pleg span{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--line)}
.avbar{display:block;width:100%;border:0;background:#B91C1C;color:#fff;font-weight:700;font-size:14px;padding:10px 14px;text-align:center}
.avbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.avbtns .btn{flex:none;min-height:48px;font-size:14px}
.opt{display:flex;flex-wrap:wrap;gap:6px}.opt button{min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:14px;color:#374151}.opt button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mdl a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 8px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px}
.logo{height:26px;width:auto;display:block}
.hd .logo{height:24px;align-self:flex-start;width:auto}
.marca{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;flex-shrink:0}
.marca .logo{height:24px;width:auto;display:block}
.marca i{width:2px;height:30px;background:rgba(255,255,255,.6);border-radius:2px}
.marca b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.12em;line-height:1;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.stepper{border:1px solid #C4CBD2;display:grid;grid-template-columns:minmax(0,1.35fr) repeat(4,minmax(0,1fr));gap:0;background:var(--paper);border-radius:14px;padding:8px 4px}
.sp{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;min-width:0;text-align:center;font-weight:600;color:var(--muted);padding:4px 2px;border-radius:10px;min-height:56px}
.sp .dot{width:24px;height:24px;font-size:12px}
.sp.cur{color:var(--navy)}.sp.ok{color:var(--green)}.sp.off{opacity:.55;cursor:default}
.sp.at{background:#EEF2F7}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.yn button{min-height:56px;border-radius:12px;font-weight:700;font-size:16px;border:2px solid var(--line);background:#fff;color:#374151}
.yn .sim.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.yn .nao.on{background:var(--red-bg);border-color:var(--red);color:#991B1B}
.card.extra{border:2px solid #F5D9A8}
.chip.refa{color:#991B1B;border-color:#E5A3A3}
.chip.refa.on{background:#B91C1C;border-color:#B91C1C;color:#fff}
.srchbtn{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:10px;border:1px solid #AEB6BE;background:linear-gradient(180deg,#FFFFFF,#EEF1F3);color:#4B5563;font-size:15px;padding:0 14px;text-align:left}
.srchbtn svg,.srch svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 12px;color:#4B5563;border:2px solid #9AA4AE}
.srch input{flex:1;min-width:0;height:48px;border:0;outline:0;font-size:16px;background:transparent;color:var(--ink)}
.th{position:relative;text-decoration:none}.th .pq{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.55);border-radius:6px;font-size:12px;padding:1px 3px}
.sync{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;padding:6px 16px;border-bottom:1px solid transparent}
.sync.ok{background:#E7F6EC;color:#14532D;border-color:#B7E1C3}.sync.pend{background:#FFF4DC;color:#92400E;border-color:#F5D9A8}.sync.off{background:#FDE8E8;color:#991B1B;border-color:#F3B4B4}
.dupla{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;color:var(--violet);text-transform:uppercase;line-height:1.2}
.resp{display:flex;gap:10px;align-items:center;background:#EEF2F7;border-radius:10px;padding:10px;font-size:14px}
.mmrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:end}
.mmrow .x{padding-bottom:12px;font-weight:700;font-size:16px;color:var(--muted)}
.mmw{position:relative;display:block}
.mmw i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.mmw .in{padding-right:32px;font-variant-numeric:tabular-nums;font-weight:600}
.miss{font-size:12px;color:var(--red);font-weight:600}
.thw{position:relative}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
.lbx img,.lbx video{max-width:100%;max-height:85vh;border-radius:8px;background:#111}
.lbx-x{position:absolute;top:14px;right:14px;min-height:44px;padding:0 16px;border-radius:22px;border:0;background:#fff;color:#111;font-weight:800;font-size:15px}
.itp{border:1px solid var(--line-2,#E5E7EB);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}

.andg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.andb{min-height:58px;border-radius:12px;border:2px solid #CBD5E1;background:#fff;color:#374151;font-weight:700;font-size:13px;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;cursor:pointer;padding:4px}
.andb .n{font-size:12px;font-weight:800;opacity:.75}

.andb.ok{background:#E7F6EC;border-color:#86C99A;color:#14532D}

.vazio{grid-column:1/-1;font-size:13px;color:var(--muted);padding:6px 2px}
.capt{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:4px}
.mbtn{min-height:52px;border-radius:12px;background:var(--navy);color:#fff;border:0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 12px;font-family:inherit}
.mbtn.sec{background:#fff;color:var(--navy);border:2px solid #CBD5E1;font-size:14px}
.mbtn input{display:none}

.recov video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}

.recov .rtime{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

.recov .rbar{display:flex;gap:10px;padding:14px 16px 22px;background:#000}
.recov .rbar button{flex:1;min-height:56px;border-radius:14px;border:0;font-size:17px;font-weight:800;font-family:inherit}

.thw .th{display:flex;width:100%}

.mdl{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mdl .box{background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.mdl .box img,.mdl .box video{width:100%;max-height:200px;object-fit:cover;border-radius:10px;background:#E5E7EB}
.mdl h3{margin:0;font-family:var(--display);font-size:19px;color:#991B1B}
.mdl p{margin:0;font-size:15px;color:#374151}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
#guia{display:none}
@media print{
@page{size:A4;margin:9mm 11mm}
html,body{background:#fff!important;margin:0!important;padding:0!important;min-height:0!important;height:auto!important}
body>*:not(#guia){display:none!important}
#guia{display:block!important}
}
#guia{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:11pt;line-height:1.25}
#guia *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#guia .gtop{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5pt solid #000;padding-bottom:6pt}
#guia .glogo{height:30pt;filter:invert(1)}
#guia .gmarca{display:flex;align-items:center;gap:9pt}#guia .gmarca i{width:2pt;height:30pt;background:#000}#guia .gmarca b{font-size:20pt;font-weight:800;letter-spacing:.12em}
#guia .gtit{text-align:right}
#guia .gtit b{display:block;font-size:17pt;letter-spacing:.06em}
#guia .gtit span{font-size:9.5pt}
#guia .gtit .gped{display:block;font-size:20pt;font-weight:800;margin:1pt 0}
#guia .gsec{margin-top:7pt;break-inside:avoid}
#guia .gsec h3{margin:0 0 4pt;font-size:10pt;letter-spacing:.08em;text-transform:uppercase;background:#E5E7EB;padding:3pt 6pt}
#guia table{width:100%;border-collapse:collapse}
#guia td,#guia th{border:.8pt solid #555;padding:3pt 6pt;vertical-align:top;text-align:left}
#guia th{font-size:9pt;background:#F3F4F6}
#guia .k{font-size:8.5pt;color:#333;display:block;text-transform:uppercase;letter-spacing:.04em}
#guia .v{font-size:12pt;font-weight:700}
#guia .prazo{font-size:16pt;font-weight:800}
#guia .num{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
#guia .tag{border:1pt solid #000;padding:0 4pt;font-size:8.5pt;font-weight:700;white-space:nowrap}
#guia .gfotos{display:grid;grid-template-columns:repeat(4,1fr);gap:5pt}
#guia .gfotos img{width:100%;height:66pt;object-fit:cover;border:.8pt solid #555}
#guia .set td{height:19pt}
#guia .gobs{border:.8pt solid #555;min-height:34pt;padding:4pt 6pt;white-space:pre-wrap}
#guia .grod{margin-top:6pt;font-size:8.5pt;display:flex;justify-content:space-between;border-top:.8pt solid #555;padding-top:4pt}
</style>
</head>

  function corProd(o){var p=o.prod||{};if(p.status==='agendada')return 'ag';if(p.andamento==='finalizado')return 'fin';var d=p.prazo?diff(p.prazo):99;if(d<0)return 'late';if(d<=4)return 'warn';return 'ok'}

      var pend=0;Object.keys(o.pendItens||{}).forEach(function(k){if(o.pendItens[k].aberta)pend++});

      if(foraAg)no.hist.push([addD(0),'Agendado FORA DE ROTA · autorizado por '+foraAg.por+' · '+foraAg.just]);S.visitas.push({id:uid(),obra:oid,data:f.data,hora:f.hora,tipo:f.tipo,done:false,foraRota:foraAg||undefined,resp:f.tipo==='ins'?f.dupla:f.med,nota:(f.tipo==='ast'?'Problema: '+f.prob.trim():(f.peca||'Peça sob medida'))+' · '+(f.tipo==='ins'?f.dupla:f.med)});save();R.day=diff(f.data);go('etapas',oid,'painel');toast('Passo 1 feito · visita em '+br(f.data)+' às '+f.hora);return}
    if(a==='salvarOrc'){if(!pode('orcamento')){toast('Somente Roberta e Aliender lançam o orçamento');return}var oo=obra(R.id);if(!f.oval){toast('Digite o valor do orçamento');return}oo.orc={valor:f.oval,extra:f.oext,mot:f.omot,obs:f.oobs,cond:f.ocond||''};oo.hist.push([addD(0),'Orçamento '+brl(f.oval)+(f.oext?' · custo extra interno '+brl(f.oext)+(f.omot?' ('+f.omot.toLowerCase()+')':''):'')]);if(oo.etapa<2)oo.etapa=2;save();render();toast('Orçamento salvo');return}
    if(a==='avancar'&&obra(R.id).etapa===2){if(!pode('orcamento')){toast('Somente Roberta e Aliender cuidam do orçamento');return}if(!liberaProd(obra(R.id))){bloqueioProd(obra(R.id));return}abrirEntradaProducao(obra(R.id));return}
    if(a==='avancar'){var o4=obra(R.id);if((o4.etapa===1||o4.etapa===2)&&!pode('orcamento')){toast('Somente Roberta e Aliender cuidam do orçamento');return}if(o4.etapa===1&&!(o4.orc&&o4.orc.valor)){toast('Lance os valores e salve o orçamento primeiro');return}o4.etapa++;o4.hist.push([addD(0),ETAPAS[o4.etapa]]);if(o4.etapa===3&&!o4.prod){o4.prod={salvo:false,entrada:addD(0),prazo:addD(10),local:'sob',produto:'bancada',coifa:'',medida:'',obs:'',status:'pend',instData:'',instalador:'',entregueEm:''};o4.hist[o4.hist.length-1][1]='Entrou em produção';save();go('producao',o4.id);toast('Em produção · preencha a ficha');return}save();render();toast('Etapa: '+ETAPAS[o4.etapa]);return}
    if(a==='agInst'&&!(obra(R.id).prod&&obra(R.id).prod.andamento==='finalizado')){toast('Finalize a produção antes de agendar a instalação');return}
    if((a==='salvarProd'||a==='agInst')&&f.status!=='pend'&&f.status!==((obra(R.id).prod||{}).status)&&!finOk(obra(R.id))){toast('Aguardando liberação do financeiro (Renan)');return}
    if(a==='agInst'&&!finOk(obra(R.id))){toast('Aguardando liberação do financeiro (Renan)');return}
    if(a==='salvarProd'){var ot=obra(R.id);if(f.status==='agendada'&&f.saida!=='ent'&&f.instalador&&ot&&ot.dupla&&f.instalador!==ot.dupla&&!f.trocaOk){pedirTroca(ot,ot.dupla,f.instalador,function(m,e){f.trocaOk={mot:m,esc:e};var bb=document.querySelector('[data-act=salvarProd]');if(bb)bb.click()});return}}
    if((a==='salvarProd'||a==='agInst')&&!prodTrava(obra(R.id))){if(!f.entrada||!f.prazo){toast('Data de entrada e prazo de entrega são obrigatórios');return}if(f.prazo<f.entrada){toast('O prazo não pode ser antes da entrada');return}}
    if(a==='salvarProd'||a==='agInst'){var o5=obra(R.id);var trav=prodTrava(o5);if(!trav){o5.cliente=f.cli;o5.pedido=f.ped;o5.vendedor=f.vend;o5.endereco=f.end;}
      var np={entrada:f.entrada,prazo:f.prazo,local:f.local,fornecedor:f.forn,produto:f.produto,coifa:f.produto==='coifa'?f.coifa:'',outro:f.outro,refpeca:f.produto==='refacao'?f.refpeca:'',refval:f.produto==='refacao'?f.refval:'',refcusto:f.produto==='refacao'?String(Math.round((+f.refval||0)*REFPCT)):'',refmot:f.produto==='refacao'?f.refmot:'',medida:fmtMed(f.ml,f.mp,f.ma),obs:f.obs,ambiente:f.ambiente||'',saida:f.saida||'ins',status:f.status,instData:f.instData,instalador:f.instalador,entregueEm:f.entregueEm,salvo:true};
      var oldp=o5.prod||{};np.andamento=oldp.andamento;np.andHist=oldp.andHist;if(oldp.passes)np.passes=oldp.passes;
      o5.prod=trav?Object.assign({},o5.prod,{saida:f.saida||'ins',status:f.status,instData:f.instData,instalador:f.instalador,entregueEm:f.entregueEm}):np;
      if(f.status==='agendada'&&f.instalador&&f.saida!=='ent'){if(!o5.dupla){o5.dupla=f.instalador;o5.hist.push([addD(0),'Dupla da obra: '+f.instalador])}else if(f.trocaOk){registrarTroca(o5,o5.dupla,f.instalador,f.trocaOk.mot,f.trocaOk.esc);f.trocaOk=null}}
      if(f.status==='agendada'&&o5.etapa<4){var ehEnt=f.saida==='ent';o5.etapa=4;o5.hist.push([addD(0),(ehEnt?'Entrega':'Instalação')+' agendada para '+br(f.instData)+(f.instalador?' · '+f.instalador:'')]);if(f.instData)S.visitas.push({id:uid(),obra:o5.id,data:f.instData,hora:'09:00',tipo:'ins',entrega:ehEnt,resp:f.instalador||'',done:false,nota:(ehEnt?'Só entrega · ':'')+nomeProd(o5.prod)+' · Pedido '+o5.pedido})}
      if(o5.etapa<3)o5.etapa=3;
      if(f.status==='entregue'){o5.etapa=5}
      save();
      if(a==='agInst'){f.status='agendada';f.instData=f.instData||addD(2);render();toast('Escolha a data e salve');return}
      go(R.tab==='producao'?'prodlista':'etapas',o5.id);toast('Ficha de produção salva');return}
  });
  render();carregarFila();
  if(S.usuario)(function espera(n){if(window.supabase)conectar();else if(n<40)setTimeout(function(){espera(n+1)},250);else barra()})(0);
  if('serviceWorker' in navigator){if(S.usuario)navigator.serviceWorker.register('sw.js').catch(function(){});else navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
})();
